<header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex h-14 w-full min-w-0 max-w-[1600px] items-center gap-4 px-4 sm:px-6 lg:px-10">
    <a href="{{ '/' | relative_url }}" class="text-lg font-bold tracking-tight text-slate-900">{{ site.title }}</a>
    <nav class="ml-6 hidden items-center gap-1 md:flex" aria-label="Sections">
      {% for section in site.data.nav %}
      <details class="group relative">
        <summary class="flex cursor-pointer list-none items-center gap-1 rounded-md px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 [&::-webkit-details-marker]:hidden">
          {{ section.title }}
          <svg class="h-3 w-3 transition group-open:rotate-180" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="absolute left-0 top-full z-50 mt-1 w-72 rounded-lg border border-slate-200 bg-white p-2 shadow-xl">
          {% for item in section.items %}
          <a href="{{ item.url | relative_url }}" class="block rounded-md px-3 py-2 text-sm text-slate-700 hover:bg-slate-100 hover:text-slate-900">{{ item.title }}</a>
          {% endfor %}
        </div>
      </details>
      {% endfor %}
    </nav>
    <div class="ml-auto flex items-center gap-3">
      <a href="{{ '/examples.html' | relative_url }}" class="hidden rounded-md px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-100 hover:text-slate-900 sm:inline-block">Examples</a>
      <a href="https://github.com/hasirciogluhq/xlang" class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">GitHub</a>
    </div>
  </div>
  <details class="border-t border-slate-200 md:hidden">
    <summary class="cursor-pointer list-none px-4 py-2 text-sm font-medium text-slate-700 [&::-webkit-details-marker]:hidden">Menu</summary>
    <div class="max-h-[70vh] overflow-y-auto px-4 pb-4">
      {% for section in site.data.nav %}
      <div class="mt-3 text-xs font-semibold uppercase tracking-wider text-slate-500">{{ section.title }}</div>
      {% for item in section.items %}
      <a href="{{ item.url | relative_url }}" class="block py-1.5 text-sm text-slate-700">{{ item.title }}</a>
      {% endfor %}
      {% endfor %}
    </div>
  </details>
</header>
