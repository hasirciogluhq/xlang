<nav aria-label="Documentation" class="text-sm">
  {% for section in site.data.nav %}
  <div class="mt-6 first:mt-0">
    <div class="mb-2 px-2 text-xs font-semibold uppercase tracking-wider text-slate-500">{{ section.title }}</div>
    <ul class="space-y-0.5">
      {% for item in section.items %}
      {% if page.url == item.url %}
      <li><a href="{{ item.url | relative_url }}" aria-current="page" class="block rounded-md bg-blue-50 px-2 py-1.5 font-semibold text-blue-700">{{ item.title }}</a></li>
      {% else %}
      <li><a href="{{ item.url | relative_url }}" class="block rounded-md px-2 py-1.5 text-slate-700 hover:bg-slate-100 hover:text-slate-900">{{ item.title }}</a></li>
      {% endif %}
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</nav>
