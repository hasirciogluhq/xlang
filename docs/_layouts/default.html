<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Helvetica', 'Arial', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'] }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-white font-sans text-slate-800 antialiased">
  {% include navbar.html %}
  <main class="mx-auto w-full min-w-0 max-w-[1600px] px-4 sm:px-6 lg:px-10">
    {{ content }}
  </main>
  <footer class="mx-auto mt-16 w-full max-w-[1600px] border-t border-slate-200 px-4 py-8 text-sm text-slate-500 sm:px-6 lg:px-10">
    <span>{{ site.title }}: the xlang language, compiler and standard library.</span>
    <a class="ml-4 hover:text-slate-900" href="https://github.com/hasirciogluhq/xlang">Source on GitHub</a>
  </footer>
</body>
</html>
