---
layout: default
---
<div class="grid gap-8 py-8 lg:grid-cols-[16rem_minmax(0,1fr)] xl:grid-cols-[17rem_minmax(0,1fr)] xl:gap-12">
  <aside class="hidden lg:block">
    <div class="sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto pb-8 pr-2">
      {% include sidebar.html %}
    </div>
  </aside>
  <details class="rounded-lg border border-slate-200 p-4 lg:hidden">
    <summary class="cursor-pointer list-none text-sm font-medium text-slate-700 [&::-webkit-details-marker]:hidden">On this section</summary>
    <div class="mt-4">{% include sidebar.html %}</div>
  </details>
  <article class="prose prose-slate min-w-0 max-w-none break-words [overflow-wrap:anywhere]
                  prose-headings:scroll-mt-20 prose-h1:text-4xl prose-h1:font-bold
                  prose-a:text-blue-700 prose-a:no-underline hover:prose-a:underline
                  prose-code:rounded prose-code:bg-slate-100 prose-code:px-1 prose-code:py-0.5 prose-code:font-normal prose-code:text-slate-800 prose-code:before:content-none prose-code:after:content-none
                  [&_pre]:rounded-xl [&_pre]:bg-slate-900 [&_pre]:p-4 [&_pre]:text-slate-100 [&_pre_code]:bg-transparent [&_pre_code]:p-0 [&_pre_code]:font-mono [&_pre_code]:text-slate-100 [&_pre_code]:before:content-none [&_pre_code]:after:content-none
                  prose-table:text-sm prose-th:bg-slate-50">
    {{ content }}
  </article>
</div>
