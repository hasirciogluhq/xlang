---
layout: default
---
<style>
  .docs-layout { display: flex; gap: 2.5rem; align-items: flex-start; }
  .docs-sidebar { flex: 0 0 15rem; position: sticky; top: 1rem; font-size: 0.92rem; }
  .docs-sidebar-title { font-weight: 700; margin-bottom: 0.75rem; }
  .docs-sidebar-title a { color: inherit; text-decoration: none; }
  .docs-sidebar-section { margin-top: 1.1rem; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: #666; }
  .docs-sidebar-list { list-style: none; margin: 0.3rem 0 0; padding: 0; }
  .docs-sidebar-list li { margin: 0.2rem 0; }
  .docs-sidebar-list a { color: #24292f; text-decoration: none; }
  .docs-sidebar-list a:hover { text-decoration: underline; }
  .docs-sidebar-list a.active { font-weight: 700; color: #0a58ca; }
  .docs-content { flex: 1 1 auto; min-width: 0; }
  @media (max-width: 760px) {
    .docs-layout { flex-direction: column; gap: 1rem; }
    .docs-sidebar { position: static; flex: none; width: 100%; }
  }
</style>
<div class="docs-layout">
  <nav class="docs-sidebar" aria-label="Documentation">
    {% include sidebar.html %}
  </nav>
  <article class="docs-content">
    {{ content }}
  </article>
</div>
