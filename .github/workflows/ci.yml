name: ci

# Builds `xl` from src/ and runs test/run.sh on every host a release ships for: every command against a real compiler, local git
# repositories and a release mirror, without the network.
#
# The compiler and the stdlib come from their GitHub releases, never from the submodules (those are for local development only):
# each is the newest stable release, or the newest pre-release while there is none (.github/actions/toolchain, cached by the pair of
# tags); `xlc_version` and `std_version` pin one. Also called by the release workflow before a release is published.

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_call:
    inputs:
      xlc_version:
        type: string
        default: ""
      std_version:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      xlc_version:
        description: "Compiler release tag to use instead of the newest one (optional)"
        type: string
        default: ""
      std_version:
        description: "Stdlib release tag to use instead of the newest one (optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # xl must type-check for every target, whatever the host is.
  check:
    name: type-check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          xlc-version: ${{ inputs.xlc_version }}
          std-version: ${{ inputs.std_version }}
      - name: xlc --check main.xl
        working-directory: src
        env:
          STD: ${{ steps.toolchain.outputs.std }}
        run: xlc main.xl -M "std=$STD" --import std -DfeatureDefaultAllocator=true --check --target ${{ matrix.target }}

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows arm64 has no compiler release yet (xlang-docs known-limitations).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          xlc-version: ${{ inputs.xlc_version }}
          std-version: ${{ inputs.std_version }}
      - name: Build xl
        working-directory: src
        env:
          STD: ${{ steps.toolchain.outputs.std }}
        run: xlc main.xl -M "std=$STD" --import std -DfeatureDefaultAllocator=true -o "../xl$([ "$RUNNER_OS" = Windows ] && echo .exe || true)"
      - name: test/run.sh
        env:
          STD: ${{ steps.toolchain.outputs.std }}
        run: test/run.sh ./xl "$(command -v xlc)" "$STD"
