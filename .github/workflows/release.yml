name: release

# Publishes a release of `xl` when a version tag is pushed: the ci workflow runs first, then xl is built with the tag's version on
# every host and attached to a GitHub release as `xl_<version>_<os>_<arch>.tar.gz` (`.zip` on Windows, the binary at the archive root)
# with `checksums.txt` (sha256sum format). `xl self-update` and scripts/install.sh read exactly these names
# (xlang-docs/compiler/install.md).
#
# Tags: vMAJOR.MINOR.PATCH is a stable release; a tag with a `-suffix` (v1.0.0-rc.1) is marked a pre-release.
# Can also be re-run for an existing tag from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "error: tag '$tag' must look like v1.2.3 or v1.2.3-rc.1" >&2; exit 1; }
          version="${tag#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

  test:
    name: Test
    needs: meta
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [meta, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: windows-2025, os: windows, arch: amd64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: Stdlib submodule
        run: git submodule update --init --depth 1 xl-std
      - uses: ./.github/actions/xlc
      - name: Build and package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          exe=; [ "$OS" = windows ] && exe=.exe
          mkdir -p stage dist
          (cd src && xlc main.xl -M std=../xl-std --import std -DfeatureDefaultAllocator=true "-DxlVersion=\"$VERSION\"" -O2 -o "../stage/xl$exe")
          # The binary must start and report the tag's version before it is published.
          ./stage/xl$exe version | grep -qx "$VERSION"
          name="xl_${VERSION}_${OS}_${ARCH}"
          if [ "$OS" = windows ]; then
            (cd stage && 7z a -tzip -bd -bso0 "../dist/$name.zip" "xl$exe")
          else
            tar -czf "dist/$name.tar.gz" -C stage xl
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: xl-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.meta.outputs.tag }}
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum xl_* | sort -k2 >checksums.txt
          cat checksums.txt
          flags=(--generate-notes --title "xl $TAG" --verify-tag)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" xl_* checksums.txt --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" xl_* checksums.txt "${flags[@]}" -R "$GITHUB_REPOSITORY"
          fi
