name: release

# Publishes a release of `xl` when a version tag is pushed: the ci workflow runs first, then xl is built with the tag's version on
# every host and attached to a GitHub release as `xl_<version>_<os>_<arch>.tar.gz` (`.zip` on Windows, the binary at the archive root)
# with the install scripts (`install.sh`, `install.ps1`, taken from the tag) and `checksums.txt` (sha256sum format, every asset).
# `xl self-update` and the install scripts read exactly these names (xlang-docs/compiler/install.md).
#
# Tags: vMAJOR.MINOR.PATCH is a stable release; a tag with a `-suffix` (v1.0.0-rc.1) is marked a pre-release.
# Can also be re-run for an existing tag from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "error: tag '$tag' must look like v1.2.3 or v1.2.3-rc.1" >&2; exit 1; }
          version="${tag#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

  test:
    name: Test
    needs: meta
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [meta, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: windows-2025, os: windows, arch: amd64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - id: toolchain
        uses: ./.github/actions/toolchain
      - name: Build and package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          XLC: ${{ steps.toolchain.outputs.xlc-bin }}
          XLANG_STD: ${{ steps.toolchain.outputs.std }}
        run: |
          set -euo pipefail
          exe=; [ "$OS" = windows ] && exe=.exe
          mkdir -p stage dist
          # The newest released xl drives the build (`xl build` runs the released xlc itself): every xl is compiled by means of
          # the previous one.
          (cd src && xl build main.xl "-DxlVersion=\"$VERSION\"" -O2 -o "../stage/xl$exe")
          # Strip the symbol table: the names of every internal function would otherwise ship (~900 entries, ~11% of the file).
          # Linux and macOS keep only what the dynamic loader needs (`strip` of binutils, `strip` of the Xcode tools, which keeps
          # the ad-hoc code signature valid on arm64); lld-link writes no symbol table into a Windows executable without /debug.
          case "$OS" in
            linux) strip --strip-all "stage/xl" ;;
            darwin) strip "stage/xl" ;;
          esac
          # The binary that is published must pass the whole suite and report the tag's version.
          ./stage/xl$exe version | grep -qx "$VERSION"
          test/run.sh "./stage/xl$exe" "$(command -v xlc)" "${{ steps.toolchain.outputs.std }}"
          name="xl_${VERSION}_${OS}_${ARCH}"
          if [ "$OS" = windows ]; then
            (cd stage && 7z a -tzip -bd -bso0 "../dist/$name.zip" "xl$exe")
          else
            tar -czf "dist/$name.tar.gz" -C stage xl
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: xl-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.meta.outputs.tag }}
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          assets=(xl_* install.sh install.ps1)
          sha256sum "${assets[@]}" | sort -k2 >checksums.txt
          cat checksums.txt
          flags=(--generate-notes --title "xl $TAG" --verify-tag)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" checksums.txt --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" checksums.txt "${flags[@]}" -R "$GITHUB_REPOSITORY"
          fi
